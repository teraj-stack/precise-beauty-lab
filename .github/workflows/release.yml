name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to simulate (e.g. v0.2.0). Defaults to the latest v* tag."
        required: false
        type: string
      dry_run:
        description: "Dry run — print body and tag, do not create a release."
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            if [[ -z "$TAG" ]]; then
              TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
            fi
            if [[ -z "$TAG" ]]; then
              echo "::error::No tag provided and no v* tag found in repo." >&2
              exit 1
            fi
            DRY_RUN="${{ inputs.dry_run }}"
          else
            TAG="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for tag
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          VERSION="${TAG#v}"
          FILE="CHANGELOG.md"

          if [[ ! -f "$FILE" ]]; then
            echo "CHANGELOG.md not found" >&2
            exit 1
          fi

          # Try to extract the section for this exact version. We accept any of:
          #   ## [1.2.3]            ## [1.2.3] - 2026-05-14
          #   ## [v1.2.3]           ## v1.2.3
          #   ## 1.2.3 - 2026-05-14 ### [1.2.3]
          # Section ends at the next version/[Unreleased] heading (## or ###).
          BODY="$(awk -v ver="$VERSION" '
            BEGIN {
              IGNORECASE = 1
              # any H2/H3 starting with a version or "unreleased"
              any_re = "^#{2,3}[[:space:]]+(\\[[[:space:]]*(v?[0-9]+\\.[0-9]+\\.[0-9]+([-][[:alnum:].]+)?|unreleased)[[:space:]]*\\]|v?[0-9]+\\.[0-9]+\\.[0-9]+([-][[:alnum:].]+)?|unreleased)([[:space:]]|$)"
              # heading carrying our exact version
              ver_re = "^#{2,3}[[:space:]]+(\\[[[:space:]]*v?" ver "[[:space:]]*\\]|v?" ver ")([[:space:]]|$)"
              found = 0
            }
            $0 ~ any_re {
              if (found) { exit }
              if ($0 ~ ver_re) { found = 1; next }
            }
            found { print }
          ' "$FILE")"

          # Fallback: if no matching section, use the [Unreleased] block
          if [[ -z "${BODY// /}" ]]; then
            BODY="$(awk '
              BEGIN {
                IGNORECASE = 1
                any_re = "^#{2,3}[[:space:]]+(\\[[[:space:]]*(v?[0-9]+\\.[0-9]+\\.[0-9]+([-][[:alnum:].]+)?|unreleased)[[:space:]]*\\]|v?[0-9]+\\.[0-9]+\\.[0-9]+([-][[:alnum:].]+)?|unreleased)([[:space:]]|$)"
                unr_re = "^#{2,3}[[:space:]]+\\[?[[:space:]]*unreleased[[:space:]]*\\]?[[:space:]]*$"
                found = 0
              }
              $0 ~ any_re {
                if (found) { exit }
                if ($0 ~ unr_re) { found = 1; next }
              }
              found { print }
            ' "$FILE")"
          fi

          if [[ -z "${BODY// /}" ]]; then
            echo "::error file=CHANGELOG.md::No section found for tag '$TAG' (looked for '## [$VERSION]') and no fallback '## [Unreleased]' section present. Aborting release." >&2
            exit 1
          fi

          {
            echo "body<<__EOF__"
            echo "$BODY"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Dry-run summary
        if: steps.resolve.outputs.dry_run == 'true'
        shell: bash
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          echo "🔎 Dry-run — no release will be created."
          echo "Tag:        $TAG"
          echo "Prerelease: ${{ contains(steps.resolve.outputs.tag, '-') }}"
          echo "----- BODY -----"
          echo "$BODY"
          echo "----------------"
          {
            echo "## 🔎 Dry-run release preview"
            echo ""
            echo "- **Tag:** \`$TAG\`"
            echo "- **Prerelease:** ${{ contains(steps.resolve.outputs.tag, '-') }}"
            echo ""
            echo "### Body"
            echo ""
            echo "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        if: steps.resolve.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.tag }}
          name: ${{ steps.resolve.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.resolve.outputs.tag, '-') }}
